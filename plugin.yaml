name: consult-committee
version: 0.3.0
description: "Ask your MoA advisors for a second opinion mid-run; the model weighs their answers and decides. Budgeted per conversation."
author: "070freebird070-ctrl"
provides_tools:
  - consult_committee
manifest_version: 2
api_version: 1
license: MIT
config_schema:
  preset:
    type: str
    default: "committee"
    label: "Committee preset"
    description: "MoA preset whose reference models are the committee's advisors (create it with: hermes moa configure committee). Only its reference models, reference temperature and reference timeout are used; advisors with enabled: false are skipped. If it does not exist, MoA's default preset is used. Empty or an off word (off, 0, false, no) always uses MoA's default preset."
  logging:
    type: bool
    default: false
    label: "Log committee calls"
    description: "Off by default. Turn on to append every consultation (question + per-advisor answers) to a plain-text file under $HERMES_HOME/logs."
  log_path:
    type: str
    default: "logs/consult-committee.log"
    label: "Log file path (fixed profile-relative default)"
    description: "Fixed default logs/consult-committee.log, resolved against the asking profile home (<profile-home>/logs/consult-committee.log). CONSULT_COMMITTEE_LOG env wins over this."
  advisor_system:
    type: str
    default: "You are a reference advisor. Only answer the question directly and concisely. No tool calls. No additional response."
    label: "Advisor system message"
    description: "System prompt prepended to every advisor call. Primary editor: advisor_system.md in the plugin dir (this field is single-line). Leave this field unsaved to use the file; once saved, it overrides the file. The default shown here is not the file content. Env CONSULT_COMMITTEE_ADVISOR_SYSTEM wins. 'off' disables."
  max_consultations:
    type: int
    default: 5
    label: "Consultations per conversation"
    description: "Committee calls allowed per conversation; only calls that return at least one advisor answer count. Suggested by caller tier: High 8, Medium 5, Low 3. 0 disables the tool. Invalid values fall back to 5."
