name: consult-committee
version: 0.1.1-fork.4
description: "Lets the model escalate a hard question to the MoA advisor committee and synthesize their answers itself."
author: "070freebird070-ctrl"
provides_tools:
  - consult_committee
manifest_version: 2
api_version: 1
license: MIT
config_schema:
  logging:
    type: bool
    default: false
    label: "Log committee calls"
    description: "Off by default. Turn on to append every consultation (question + per-advisor answers) to a plain-text file under $HERMES_HOME/logs."
  log_path:
    type: str
    default: "logs/consult-committee.log"
    label: "Log file path (fixed profile-relative default)"
    description: "Fixed default logs/consult-committee.log, resolved against the asking profile home (<profile-home>/logs/consult-committee.log). CONSULT_COMMITTEE_LOG env wins over this."
